/*      2. 改為從 Cookie 讀取 Token */
    let G_TOKEN = getCookie("trip_auth_token") || "";
  
/*      --- Cookie 操作函式 --- */
    function setCookie(name, value, days) {
      let expires = "";
      if (days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        expires = "; expires=" + date.toUTCString();
      }
      document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict";
    }
  
    function getCookie(name) {
      let nameEQ = name + "=";
      let ca = document.cookie.split(';');
      for(let i=0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0)==' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
      }
      return null;
    }

  <style>

    .btn-outline{

    .chip{

      user-select:none;

    }

    .chip.on{

    .chip.off{

    .seg{

      background:rgba(233,225,214,.9);
      padding:4px;
      border-radius:14px;
      margin:8px 0 12px;

    .seg-btn{

      text-align:center;
      padding:10px 0;
      border-radius:10px;
      font-weight:900;
      font-size:.9rem;

    /* checklist */
    .checklist-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .check-item{
      background:rgba(255,255,255,.65);
      border:1px solid rgba(233,225,214,.8);
      border-radius:var(--radius-S);

    /* 全員待辦 */
    .todo-li{
      display:flex; align-items:flex-start; gap:10px;
      padding:10px 0; border-bottom:1px solid rgba(233,225,214,.8);

    .todo-li:last-child{ border-bottom:none; }
    .todo-li input{ width:18px; height:18px; margin-top:2px; accent-color:#8C6B43; }
    .todo-title a{ color:inherit; text-decoration:none; font-weight:900; }
    .todo-title span{ font-weight:900; }
    .todo-note{ font-size:.85rem; color:var(--ink2); margin-top:4px; line-height:1.45; }


    .day-hero{
        margin:6px 0 14px;
        border-radius:24px;
        overflow:hidden;
        border:1px solid rgba(233,225,214,.9);
        box-shadow:0 10px 26px rgba(0,0,0,.08);
        background:rgba(255,255,255,.6);
    }
    /* ===== Hotel slideshow (same behavior as DayHero) ===== */
    .hotel-hero{
      border-radius:24px;
      overflow:hidden;
      border:1px solid rgba(233,225,214,.9);
      box-shadow:0 10px 26px rgba(0,0,0,.08);
      background:rgba(255,255,255,.6);
    }

    .hotel-track{
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .hotel-track::-webkit-scrollbar{ display:none; }

    .hotel-slide{
      flex:0 0 100%;
      aspect-ratio: 3 / 2;     /* ✅ 比你原本 180px 更大、更好看 */
      scroll-snap-align:start;
      position:relative;
      overflow:hidden;
    }

    .hotel-slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* 右下角淡淡數字（可選） */
    .hotel-badge{
      position:absolute;
      right:10px;
      bottom:10px;
      padding:5px 9px;
      border-radius:999px;
      background:rgba(0,0,0,.22);
      color:#fff;
      font-weight:900;
      font-size:.78rem;
      text-shadow:0 2px 10px rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.18);
    }

    .hero-track{
        display:flex;
        overflow-x:auto;
        scroll-snap-type:x mandatory;
        scrollbar-width:none;
    }
    .hero-track::-webkit-scrollbar{ display:none; }

    .hero-slide{
        flex:0 0 100%;
        aspect-ratio: 16 / 9;   /* ✅ 固定 16:9 */
        height:auto;            /* ✅ 不用固定高度 */
        scroll-snap-align:start;
        position:relative;
        overflow:hidden;
    }
    .hero-slide .hero-img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }
    /* 背景層：填滿 + 模糊 */
    .hero-slide.hero--blur .hero-bg{
      position:absolute;
      inset:-18px;                 /* 避免 blur 露邊 */
      width:100%;
      height:100%;
      object-fit:cover;
      filter: blur(18px) saturate(1.05) brightness(1.05);
      transform: scale(1.12);
    }

    /* 前景層：完整顯示（不裁切） */
    .hero-slide.hero--blur .hero-img{
      position:relative;
      width:100%;
      height:100%;
      object-fit:cover;          /* ✅ 關鍵 */
      display:block;
    }

    /* 可選：再加一層淡暗幕，讓字更穩 */
    .hero-slide.hero--blur::after{
      content:"";
      position:absolute;
      inset:0;
       background: transparent;
      pointer-events:none;
    }


    .hero-dots{
		  display:none;
		position:absolute;
		  left:0; right:0; bottom:10px;
		  display:flex;
		  justify-content:center;
		  gap:6px;
		  pointer-events:auto;
    }
    .hero-dot{
        width:6px; height:6px;
        border-radius:50%;
        background:transparent;
    }
    .hero-dot.active{ background:rgba(255,255,255,.95); }

    .hero-overlay{
      position:absolute;
      left:12px;                      /* 距左 12 */
      right:12px;                     /* 距右 12（等於容器有左右留白） */
      bottom:2px;                     /* ✅ 貼近圖片底部（想更貼就改 4px 或 0） */
      display:flex;                   /* 讓左右兩塊分開放 */
      justify-content:space-between;  /* 左：hero-loc / 右：hero-caption */
      align-items:flex-end;           /* 兩者都貼齊底部 */

      gap:12px;                       /* 左右之間的安全距離 */
      max-width:none;                 /* ✅ 不要用 75% 限制，不然右邊會被擠 */
      pointer-events:none;            /* 可選：避免遮到滑動/點擊 */
    }

    .hero-loc{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:8px;

      /* ✅ 橢圓膠囊底：很淡，但可讀性大幅提升 */
      padding:4px 10px;                 /* 讓膠囊有呼吸空間 */
      border-radius:999px;              /* 橢圓 */
      background: rgba(0,0,0,.18);      /* 很淡的黑底（你可在 .14~.24 間調） */

      /* ✅ 字不要太粗，但要清楚 */
      color: rgba(255,255,255,.95);
      font-size:.90rem;
      font-weight:400;                  /* 700 → 600 更自然 */

      /* ✅ 淡描邊：讓亮背景上也不會消失 */
      border: 1px solid rgba(255,255,255,.18);

      /* ✅ 文字陰影：補強對比 */
      text-shadow: 0 2px 10px rgba(0,0,0,.60);

      /* ✅ 取消毛玻璃（維持你需求） */
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
    }

    .hero-caption{
      pointer-events:auto;            /* 若 caption 需要可點擊 */
      padding:3px 8px;                      /* ✅ 不要底、不要內距，視覺更貼底 */
      background:rgba(0,0,0,.18);         /* ✅ 不要底色 */
      border-radius:0;
      border:1px solid rgba(255,255,255,.18); /* ✅ 淡外框 */

      color:#fff;                     /* ✅ 白色 */
      font-weight:900;
      font-size:1rem;               /* ✅ 字變大（你可改 1rem / 1.05rem） */
      line-height:1.15;               /* ✅ 讓文字更緊湊不會浮起來 */

      text-align:right;               /* ✅ 右下角對齊 */
      text-shadow:0 2px 10px rgba(0,0,0,.65); /* ✅ 保持清楚 */
      transform:translateY(-2px);             /* ✅ 上移 2px */

      margin:0;                       /* ✅ 避免被預設 margin 撐開 */
      -webkit-text-stroke: .4px rgba(0,0,0,.35);
      /* backdrop-filter: blur(6px); */     /* ❌ 取消毛玻璃 */
      /* -webkit-backdrop-filter: blur(6px); */
    }

    body{ font-family: var(--font-sans); }

      font-family: var(--font-serif);

    .weather-strip{
      display:flex; gap:20px; overflow-x:auto;
      padding-bottom:10px; margin-bottom:14px;

      border-bottom:1px solid var(--divider);

    /* ✅ 讓每一列：左時間、右內容 固定對齊 */
    .timeline-item{
        display:grid;
        grid-template-columns: 64px 1fr;
        column-gap:12px;
        align-items:start;
        margin-bottom:18px; 
        cursor:pointer; 

	/* --- 新增：防止系統選單干擾長壓 --- */
        -webkit-touch-callout: none; /* 禁用 iOS 長壓彈出選單 */
        -webkit-user-select: none;   /* 禁止長壓選取文字 */
        user-select: none;           /* 標準屬性 */
        touch-action: pan-y;         /* 允許垂直捲動，但防止其他觸控手勢衝突 */
    }
    .tl-time{
      min-width:56px;
      font-family:'Roboto Mono', monospace;
      font-weight:700;
      color:var(--ink2);
      text-align:right;
      padding-top:6px;

    }

    .tl-time{ position:relative; }

      margin-top:8px;
      width:28px; height:28px;
      border-radius:999px;
      border:1px solid rgba(233,225,214,.95);
      background:#fff;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;

    .time-photo-btn:active{ transform:scale(.96); }
    


    .tl-content{
      position:relative;
      flex:1;
      min-width:0;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(233,225,214,.9);
      border-radius:var(--radius-M);
      padding:10px 16px 10px;
      box-shadow:0 14px 30px rgba(0,0,0,.07);

    .modal-overlay{

    /* 點開小程式懸浮的 */
    .modal-sheet{
      position:fixed;
      left:50%;
      background:#FAF7F2;     /* ✅ 一定要有 */
      box-shadow:0 18px 70px rgba(0,0,0,.22); /* ✅ 讓它像真的浮起來 */
      bottom:max(14px, env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(120%);
      width:min(760px, calc(100vw - 24px));

      /* ✅ 用 dvh 比 vh 穩（手機網址列縮放不亂跳） */
      max-height:calc(100dvh - 24px - env(safe-area-inset-top));
      background:#FAF7F2;
      z-index:2001;
      border-radius:28px;
      border:1px solid rgba(233,225,214,.95);
      box-shadow:0 22px 60px rgba(0,0,0,.18);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      /* transition:transform .18s cubic-bezier(.16,1,.3,1); */
      transform: translateX(-50%) translateY(calc(100dvh + 60px)); /* ✅ 徹底移出視窗 */
      visibility: hidden;    /* ✅ 連陰影都不會露 */
      pointer-events: none;  /* ✅ 不會吃到點擊 */
      will-change: transform;
    }

    .modal-sheet.active{ 
      transform: translateX(-50%) translateY(0);
      visibility: visible;
      pointer-events: auto;
     }

    /* ✅ Header 不滾動，永遠在上方 */
    .modal-header{
      position:relative;
      flex:0 0 auto;
      padding:4px 0 2px;
      background:#FAF7F2;
      border-bottom:1px solid rgba(233,225,214,.75);
      z-index: 2700;       /* 必須高於 .sheet-splash 的 2600 */
      touch-action: none;  /* 禁止瀏覽器嘗試捲動，強制讓 JS 接手拖曳 */						 
    }

    /* 拖曳條保持置中 */
    .modal-drag-handle{
      width:44px; height:5px;
      background:#D8CFC4;
      border-radius:99px;
      margin:8px auto 6px;
      flex-shrink:0;
      touch-action:none;
      user-select:none;
    }

    /* ✅ X 永遠可見（在 header 內） */
    .modal-x{
      position:absolute;
      right:12px;
      top:8px;
      width:30px; height:30px;  /* ✅ 圓圈小一點 */
      border-radius:50%;

      border:1px solid rgba(233,225,214,.95);
      background:#fff;
      font-size:20px;
      line-height:1;             /* ✅ 防止 baseline 視覺偏移 */
      cursor:pointer;
      align-items:center; 
      justify-content:center;
      z-index:10;
    }

    /* 內容滾動只在這裡發生 */
    .modal-scroll{
      flex:1;
      overflow-y:auto;
      padding:0 18px 16px;
      background:#FAF7F2;           /* ✅ 防止透出看到背後 */
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      /* 💡 關鍵：允許垂直捲動，但當我們攔截事件時，瀏覽器應停止其原生行為 */
      overscroll-behavior-y: none; 
      touch-action: pan-y; 
    }

  /* Overlay：一層暗色 + blur */
  .sheet-splash{
    position:fixed;
    inset:0;

    display:flex;

    justify-content:center;
    padding:14px;

    opacity:0;

    background: rgba(0,0,0,.38);
    backdrop-filter: blur(12px);

  }
  .sheet-splash.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  /* 相機預覽框（大、乾淨） */
  .splash-frame{
    position:relative;
    width: min(96vw, 980px);
    max-height: min(86vh, 860px);
    border-radius: 22px;
    overflow:hidden;
    background: rgba(255,255,255,.06);

    box-shadow: 0 30px 110px rgba(0,0,0,.38);

  #sheetSplashFrame::before{ display:none !important; }

  .splash-frame::after{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.14);
    pointer-events:none;
    z-index:3;
  }

  /* 快門閃 */
  .splash-frame .shutter-flash{
    position:absolute;
    inset:0;
    border-radius:22px;
    background:rgba(255,255,255,.92);
    opacity:0;
    pointer-events:none;
    z-index:4;
  }
  .splash-frame.flash .shutter-flash{
    animation: shutterFlash 120ms ease-out 1;
  }
  @keyframes shutterFlash{
    0%   { opacity:0; }
    15%  { opacity:1; }
    100% { opacity:0; }
  }

  .splash-grid{

<script>
/*    ====== Globals (JSON 驅動) ====== */
  let CONFIG, CHECKLISTS, TODOS, FLIGHTS, HOTELS, ITINERARY, SOUVENIRS, GASSTATIONS;

  let users = [];
  let curUser = 'Kerwin';
  let curPayer = 'Kerwin';

    addMode = m;
    renderExpenseUI();

/*    timeline (支援本機即時編輯：拖曳排序 / 改時間 / 刪除) */
/*    ✅ 先宣告編輯模式狀態，避免 TDZ 造成行程渲染失敗 */
  let __tlEditMode = false;
  let __tlSortable = null;
  let __editHistory = [];

  let checklistData = { carry: [], check: [] };
  let hotels = [];
  let itineraryIndex = [];
  let dayCache = {};
  let currentDayData = null;
  let currentDayIdx = 0;
  let __heroTimer = null;
  let __sheetSplashTimer = null;


  function pickSheetSplashSrcs(item){
  const main =
    item?.splash || item?.splash_img ||
    item?.cover  || item?.cover_img  ||
    item?.image  || item?.img || '';

  const second =
    item?.splash2 || item?.splash_img2 ||
    item?.cover2  || item?.cover_img2  ||
    item?.image2  || item?.img2 || '';

  let list = [];
  if(Array.isArray(main)){
    list = main;
  }else{
    list = [main, second].filter(Boolean);
  }
  return list.map(s => normalizeAssetUrl(s)).filter(Boolean).slice(0,2);
}

function hideSheetSplash(){
  const ov = document.getElementById('sheetSplash');
  const sheet = document.getElementById('modalSheet');
  const img1 = document.getElementById('sheetSplashImg1');
  const img2 = document.getElementById('sheetSplashImg2');
  if(!ov || !sheet) return;

  ov.classList.remove('active');
  ov.setAttribute('aria-hidden','true');
  sheet.classList.remove('splash-on');
  const frame = document.getElementById('sheetSplashFrame');
  if(frame) frame.style.setProperty('--splash-bg', 'none');

  // ✅ reset（避免下一次 opacity 還是 0）
  [img1, img2].forEach(img=>{
    if(!img) return;
    img.style.transition = '';
    img.style.opacity = '1';
    img.style.display = 'none';
    img.removeAttribute('src');
  });

  // 移除點擊 handler（避免殘留）
  ov.onclick = null;
}

function showSheetSplash(item){
  const srcs = pickSheetSplashSrcs(item);
  if(!srcs.length) return;

  const ov    = document.getElementById('sheetSplash');
  const sheet = document.getElementById('modalSheet');
  const grid  = document.getElementById('sheetSplashGrid');
  const img1  = document.getElementById('sheetSplashImg1');
  const img2  = document.getElementById('sheetSplashImg2');
  if(!ov || !sheet || !grid || !img1 || !img2) return;

  // ✅ 清 timer
  if(__sheetSplashTimer) clearTimeout(__sheetSplashTimer);

  // ✅ 每次都 reset（重點：把 opacity 拉回 1）
  [img1, img2].forEach(img=>{
    img.style.transition = '';
    img.style.opacity = '1';
    img.style.display = 'none';
    img.removeAttribute('src');
  });

  // ✅ 1/2 張模式 class
  grid.classList.remove('one','two');
  grid.classList.add(srcs.length >= 2 ? 'two' : 'one');

  // ✅ 塞第一張
  img1.src = srcs[0];
  img1.style.display = 'block';

  // ✅ caption（如果你有這個 DOM）
  const cap = document.getElementById('sheetSplashCaption');
  if(cap) cap.textContent = item?.title ? String(item.title).replace(/\n/g,' ') : '';

  ov.classList.add('active');
  ov.setAttribute('aria-hidden','false');
  sheet.classList.add('splash-on');
  const counter = document.getElementById('sheetSplashCounter');

  if(counter){
    counter.textContent = (srcs.length > 1) ? `1/${srcs.length}` : '';
  }

  if(grid && counter && srcs.length > 1){
    // 先移除舊監聽（避免重複）
    grid.onscroll = null;
    grid.onscroll = () => {
      const w = grid.clientWidth || 1;
      const i = Math.round(grid.scrollLeft / w);
      counter.textContent = `${Math.min(i+1, srcs.length)}/${srcs.length}`;
    };
  }

  // ✅ 快門閃一下
  const frame = document.getElementById('sheetSplashFrame');
  if(frame) frame.style.setProperty('--splash-bg', `url("${srcs[0]}")`);

  // ✅ 點一下提前跳過
  ov.onclick = () => {
    if(__sheetSplashTimer) clearTimeout(__sheetSplashTimer);
    hideSheetSplash();
  };

  // ✅ 兩張圖：1.6s → 淡入第2張 → 1.6s → 關閉
  if(srcs.length >= 2){
    img2.src = srcs[1];         // 先預載
    img2.style.display = 'block';
    img2.style.opacity = '0';
    img2.style.transition = 'opacity .32s ease';
    img1.style.transition = 'opacity .32s ease';

    setTimeout(()=>{
      // 第二張淡入、第一張淡出（明信片切換感）
      img2.style.opacity = '1';
      img1.style.opacity = '0';
    }, 1600);

    __sheetSplashTimer = setTimeout(()=> hideSheetSplash(), 1600 + 320 + 1600);
  }else{
    // 單張：3 秒（明信片停留一下）
    __sheetSplashTimer = setTimeout(()=> hideSheetSplash(), 3000);
  }
}

}

        <i class="fas fa-gas-pump"></i> 加油站備案
      </h3>
      <div style="color:var(--ink2); font-weight:800; margin-bottom:10px;">
        旅行中快速找最近可加油點
      </div>
      ${list.map(s=>`
        <div style="padding:12px 0; border-top:1px solid rgba(233,225,214,.8);">
          <div style="font-weight:900;">${escapeHtml(s.name||'')}</div>
          ${s.addr ? `<div style="color:var(--ink2); font-weight:800; margin-top:4px;">${escapeHtml(s.addr)}</div>`:''}

            ${s.tel ? `<button class="btn btn-outline" onclick="openUrl('tel:${encodeURIComponent(s.tel)}')">電話</button>`:''}

  function initModalSwipe(){
    const sh = document.getElementById('modalSheet');
    const splash = null; // 你這份沒有 sheetSplash，就不判斷
    if(!sh) return;

    let sx=0, sy=0, tracking=false;

    sh.addEventListener('pointerdown', (e)=>{
      if(!sh.classList.contains('active')) return;
      // 不限制 scrollTop，任何位置都能滑
      tracking = true;
      sx = e.clientX; sy = e.clientY;
    }, {passive:true});

    sh.addEventListener('pointerup', (e)=>{
      if(!tracking) return;
      tracking = false;

      const dx = e.clientX - sx;
      const dy = e.clientY - sy;

      if(Math.abs(dx) < 70) return;
      if(Math.abs(dx) < Math.abs(dy) * 1.2) return;

      if(dx < 0) modalGoto(+1); // 左滑下一個
      else       modalGoto(-1); // 右滑上一個
    }, {passive:true});

    sh.addEventListener('pointercancel', ()=>{ tracking=false; }, {passive:true});
  }


  function initToTopButton(){
    const btn = document.getElementById('toTopBtn');
    if(!btn) return;

    const THRESHOLD = 260; // 往下滑超過多少 px 才出現（可自行調）

    const update = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      btn.classList.toggle('show', y > THRESHOLD);
    };

    // 初始：一定隱藏
    update();

    // 滾動時：再判斷要不要出現
    window.addEventListener('scroll', update, { passive:true });

    // 點擊：平滑回到最上面
    btn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

    const items = currentDayData?.items || [];

    if(next < 0 || next >= items.length) return;

        openModal(next, { keepOpen:true, skipSplash: !!opt.skipSplash });

  function formatDuration(mins){
    const m = Number(mins);
    if(!Number.isFinite(m) || m <= 0) return '';
    const h = Math.floor(m / 60);
    const r = m % 60;
    if(h <= 0) return `${m} min`;
    if(r === 0) return `${h} hr`;
    return `${h} hr ${r} min`;
  }

            decoding="async"

            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80';"
            class="hero-bg" aria-hidden="true"
          >
          <img
            src="${escapeHtml(p.src)}"
            alt="day photo ${idx+1}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80';"

          >
          <div class="hero-overlay">
            ${p.loc ? `<div class="hero-loc"><i class="fas fa-location-dot"></i>${escapeHtml(p.loc)}</div>` : ``}
            ${p.caption ? `<div class="hero-caption">${escapeHtml(p.caption)}</div>` : ``}
          </div>
        </div>
      `).join('');

      el.innerHTML = `<div class="hero-track" id="heroTrack">${slides}</div>`;

      const track = document.getElementById('heroTrack');
      if(!track) return;

      /*          ✅ 桌機滾輪也能左右滑 */
      enableWheelHorizontal(track);

      if(__heroTimer) clearInterval(__heroTimer);

      /*          auto slide */

      let cur = 0;
      let rafLock = 0;
      let snapTimer = 0;

      function getIndex(){
        const w = track.clientWidth || 1;
        const idx = Math.round(track.scrollLeft / w);
        // clamp：避免超界
        return Math.max(0, Math.min(idx, photos.length)); // 注意：最大允許到 photos.length（clone）
      }

      // ✅ 初始化 cur：避免一開始 timer 跟當下位置不同步
      cur = Math.min(getIndex(), photos.length - 1);

      track.addEventListener('scroll', () => {
        if (rafLock) cancelAnimationFrame(rafLock);
        rafLock = requestAnimationFrame(() => {
          const idx = getIndex();

          // idx 可能是 0..photos.length（最後一格是 clone）
          cur = Math.min(idx, photos.length - 1);

          // ✅ 停下來後，如果人在 clone（最右邊那張），瞬間跳回第 1 張
          clearTimeout(snapTimer);
          snapTimer = setTimeout(() => {
            if (photos.length > 1 && getIndex() === photos.length) {
              track.scrollTo({ left: 0, behavior: 'auto' });
              cur = 0;
            }
          }, 80);
        });
      });

      if (__heroTimer) clearInterval(__heroTimer);
      __heroTimer = setInterval(() => {
        if (photos.length <= 1) return;

        const next = cur + 1;
        track.scrollTo({ left: next * track.clientWidth, behavior: 'smooth' });

        // 若 next 到 clone，先預設回 0（scroll handler 也會保險修正）
        cur = (next >= photos.length) ? 0 : next;
      }, 12000);

function parseHHMMToMin(t){
  const m = String(t||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const hh = Number(m[1]), mm = Number(m[2]);
  if(!Number.isFinite(hh) || !Number.isFinite(mm)) return null;
  return hh*60+mm;
}

async function autoJumpToNextSpot(){
  // 1) 找今天是哪一天（用 meta.file 的日期）
  const today = new Date();
  const y = today.getFullYear();
  const mo = String(today.getMonth()+1).padStart(2,'0');
  const d  = String(today.getDate()).padStart(2,'0');
  const iso = `${y}-${mo}-${d}`;

  const dayIdx = itineraryIndex.findIndex(m => String(m.file||'').includes(iso));
  if(dayIdx < 0) return;

  await selectDay(dayIdx);

  // 2) 找下一個 item（以目前時間）
  const nowMin = today.getHours()*60 + today.getMinutes();
  const items = currentDayData?.items || [];
  let targetIdx = -1;

  for(let i=0;i<items.length;i++){
    if(items[i]?.type === 'route') continue;
    const t = parseHHMMToMin(items[i]?.time);
    if(t != null && t >= nowMin){
      targetIdx = i;
      break;
    }
  }
  if(targetIdx < 0) return;

  // 3) scroll 到那個 item（不一定要 openModal）
  const node = document.getElementById(`exp-item-${targetIdx}`);
  if(node) node.scrollIntoView({ behavior:'smooth', block:'center' });

  // 如果你想直接打開詳細：
  // openModal(targetIdx);
}

function dayKey(meta){ return `day_edits_${meta.file}`; }

async function loadDayItems(meta){
  // 先看 localStorage edits
  try{
    const raw = localStorage.getItem(dayKey(meta));
    if(raw){
      const saved = JSON.parse(raw);
      if(Array.isArray(saved?.items)) return saved.items;
    }
  }catch(e){}

  // 沒有 edits → fetch 原始日檔
  const data = await fetch(meta.file, { cache:'no-store' }).then(r=>r.json());
  return Array.isArray(data?.items) ? data.items : [];
}

function saveDayItems(meta, items){
  localStorage.setItem(dayKey(meta), JSON.stringify({ file: meta.file, items }));
}

async function moveItemToDay(fromDayIdx, itemIdx, toDayIdx){
  if(toDayIdx === fromDayIdx) return;

  const fromMeta = itineraryIndex[fromDayIdx];
  const toMeta   = itineraryIndex[toDayIdx];
  if(!fromMeta || !toMeta) return;

  const fromItems = currentDayData?.items || [];
  const item = fromItems[itemIdx];
  if(!item) return;

  // 1) 從來源移除
  const newFrom = fromItems.slice();
  newFrom.splice(itemIdx, 1);
  saveDayItems(fromMeta, newFrom);

  // 2) 讀目標 items
  const toItems = await loadDayItems(toMeta);
  const newTo = toItems.slice();

  // 3) 插入（最簡單：push 到尾端）
  newTo.push(item);
  saveDayItems(toMeta, newTo);

  // 4) 更新目前畫面（你留在原本那天）
  currentDayData.items = newFrom;
  renderTimelineList(currentDayData);
  enableTimelineSortable?.();

  // 若你希望搬移後自動跳到目標天：
  // await selectDay(toDayIdx);
}

     2) "地點名稱" (字串：只用於 Google，縮圖不畫點)
     3) { q:"地點名稱", lat:34.12, lng:134.56 } (物件：Google + 縮圖都能用)
*/
    const pts = rawPts.map(p=>{
      if(p == null) return null;

      if(typeof p === 'string'){
        const s = p.trim();
        if(!s) return null;
        const ll = parseLatLng(s);
        if(ll) return { q: `${ll.lat},${ll.lng}`, lat: ll.lat, lng: ll.lng };
        return { q: s };
      }

      if(typeof p === 'object'){
        const q = (p.q || p.name || p.title || '').toString().trim();
        const lat = (p.lat != null) ? Number(p.lat) : null;
        const lng = (p.lng != null) ? Number(p.lng) : null;
        const hasLL = Number.isFinite(lat) && Number.isFinite(lng);
        return { q: q || (hasLL ? `${lat},${lng}` : ''), lat: hasLL ? lat : null, lng: hasLL ? lng : null };
      }

      return null;
    }).filter(Boolean);

    if(!route || pts.length < 2){

    const gUrl = buildGoogleDirUrlFromPoints(pts, mode);

/*      --- 先準備座標點（只有有 lat/lng 的才拿來畫縮圖 + OSRM）--- */
    const stopLatLngs = pts.filter(p=>Number.isFinite(p.lat) && Number.isFinite(p.lng)).map(p=>({lat:p.lat, lng:p.lng}));

  function buildGoogleDirUrlFromPoints(points, mode='drive'){
/*      points: [{q,lat,lng}, ...] */
    const list = points.map(p => (p?.q || (p?.lat!=null && p?.lng!=null ? `${p.lat},${p.lng}` : '')).trim()).filter(Boolean);
    if(list.length < 2) return 'https://www.google.com/maps';

    const origin = list[0];
    const dest   = list[list.length - 1];
    const wps    = list.slice(1, -1).join('|');   /* pipe-separated */

    const tm = travelModeForRoute(mode);
    return `https://www.google.com/maps/dir/?api=1`
      + `&origin=${encodeURIComponent(origin)}`
      + `&destination=${encodeURIComponent(dest)}`
      + (wps ? `&waypoints=${encodeURIComponent(wps)}` : '')
      + `&travelmode=${tm}`;
  }
  function buildGoogleDirPathUrl(points){
/*      https://www.google.com/maps/dir/點1/點2/點3/點4 */
    const path = points.map(p => encodeURIComponent(p)).join('/');
    return `https://www.google.com/maps/dir/${path}`;
  }
  function parseLatLng(s){
/*      支援 "lat,lng" 字串 */
    if(!s) return null;
    const m = String(s).trim().match(/^(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)$/);
    if(!m) return null;
    const lat = parseFloat(m[1]);
    const lng = parseFloat(m[3]);
    if(Number.isNaN(lat) || Number.isNaN(lng)) return null;
    return {lat, lng};
  }
  function normalizeLatLng(p){
    if(!p) return null;
    if(typeof p === 'string') return parseLatLng(p);
    if(Array.isArray(p) && p.length>=2){
      const lat = Number(p[0]), lng = Number(p[1]);
      if(Number.isFinite(lat) && Number.isFinite(lng)) return {lat,lng};
      return null;
    }
    if(typeof p === 'object' && Number.isFinite(p.lat) && Number.isFinite(p.lng)){
      return {lat:Number(p.lat), lng:Number(p.lng)};
    }
    return null;
  }


  function haversineKm(a, b){
    const R = 6371; /* Earth radius km */
    const toRad = (d)=> d*Math.PI/180;
    const dLat = toRad(b.lat - a.lat);
    const dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat);
    const lat2 = toRad(b.lat);

    const x = Math.sin(dLat/2)**2 +
              Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
    return R * c;
  }

  
function estimateRouteKm(points){
/*    Fallback: straight-line (haversine) distance in km (UNDER-estimates driving distance). */
  const coords = (points||[]).map(parseLatLng).filter(Boolean);
  if(coords.length < 2) return null;
  let sum = 0;
  for(let i=0;i<coords.length-1;i++){
    sum += haversineKm(coords[i], coords[i+1]);
  }
  return sum;
}

/*  ✅ Preferred: get road route from OSRM and return { distanceKm, pathLatLngs } */
async function fetchOsrmRoute(latlngPoints, mode){
  try{
/*      latlngPoints 目前在 renderDayRouteCard 給的是 [{lat,lng}, ...] */
    const pts = (latlngPoints || [])
      .map(normalizeLatLng)     /*  -> {lat,lng} */
      .filter(Boolean);

    if(pts.length < 2) return null;

/*      OSRM 需要 lon,lat */
    const coords = pts.map(p => `${p.lng},${p.lat}`).join(';');

/*      OSRM demo server profiles: driving / walking / cycling */
    const m = (mode || 'drive').toLowerCase();
    const profile = (m === 'walk') ? 'walking' : 'driving';

    const url = `https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`;

    const r = await fetch(url);
    const j = await r.json();

    if(!j || j.code !== 'Ok' || !j.routes || !j.routes[0]) return null;

    const distKm = (j.routes[0].distance || 0) / 1000;

/*      轉成 [{lat,lng}, ...]（跟你其他地方一致，renderRouteMiniMap 才能畫「道路曲線」） */
    const line = j.routes[0]?.geometry?.coordinates || [];
    const pathLatLngs = line.map(([lon, lat]) => ({ lat, lng: lon }));

    return { distanceKm: distKm, pathLatLngs };
  }catch(e){
    console.warn('OSRM route failed', e);
    return null;
  }
}


function buildOsmStaticThumb(center, zoom, points){
/*
     OSM 靜態地圖服務（免 key）
     需要 center，否則就用第一個點（若是座標可用）或 fallback 一張 placeholder
*/
    const base = 'https://staticmap.openstreetmap.fr/staticmap.php';

    const c = (center && center.includes(',')) ? center : null;

/*      markers：最多建議放 5 個，不然 URL 太長（你要更多點就只放起訖） */
    const mk = [];
    const pick = points.length <= 5 ? points : [points[0], points[points.length-1]];

/*      若 pick 是 "lat,lng" 才能當 marker；若是文字地址 OSM 靜態圖沒辦法地理編碼 */
    pick.forEach(p=>{
      if(/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(p)){
        mk.push(`&markers=${encodeURIComponent(p)},lightblue1`);
      }
    });

/*      沒 center 又沒有座標 marker → 給一張淡底圖（避免 broken image） */
    if(!c && mk.length === 0){
      return 'data:image/svg+xml,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450">
          <rect width="100%" height="100%" fill="#f3f1ee"/>
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
            fill="#9a938a" font-size="24" font-family="system-ui, -apple-system">
            請在 route.preview.center 設定座標
          </text>
        </svg>`
      );
    }

    const centerParam = c ? `center=${encodeURIComponent(c)}&zoom=${encodeURIComponent(zoom)}` : '';
    return `${base}?${centerParam}&size=800x450&maptype=mapnik${mk.join('')}`;
  }

    keyboard:false,
    tap:false
  }).setView([centerObj.lat, centerObj.lng], zoom || 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

/*    --- route line (用 OSRM 的道路 polyline 會更像 Google 那種走法) --- */
  if(Array.isArray(pathLatLngs) && pathLatLngs.length >= 2){
    const line = L.polyline(pathLatLngs.map(p=>[p.lat,p.lng]), {
      weight: 5,
      opacity: .95,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

/*      subtle outline */
    L.polyline(pathLatLngs.map(p=>[p.lat,p.lng]), {
      weight: 10,
      opacity: .18,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    try{ map.fitBounds(line.getBounds(), {padding:[14,14]}); }catch(e){}
  }else if(Array.isArray(stopLatLngs) && stopLatLngs.length >= 2){
    const line = L.polyline(stopLatLngs.map(p=>[p.lat,p.lng]), { weight: 4, opacity: .75 }).addTo(map);
    try{ map.fitBounds(line.getBounds(), {padding:[14,14]}); }catch(e){}
  }

/*    --- stop markers (只放停靠點，不要把整條 polyline 每點都變 marker) --- */
  (stopLatLngs || []).forEach((p, i)=>{
    const isStart = (i === 0);
    const isEnd   = (i === (stopLatLngs.length - 1));
    const cls = isStart ? 'rm-start' : (isEnd ? 'rm-end' : 'rm-stop');

    const icon = L.divIcon({
      className: `rm-pin ${cls}`,
      html: `<span>${isStart ? 'S' : (isEnd ? 'G' : (i))}</span>`,
      iconSize: [24,24],
      iconAnchor: [12,12]
    });
    L.marker([p.lat, p.lng], { icon }).addTo(map);
  });

  window.__routeMap = map;
}
function wmoToZh(code){
  // 夠用版（你也可再細分）
  if(code === 0) return '晴';
  if([1,2,3].includes(code)) return '多雲';
  if([45,48].includes(code)) return '有霧';
  if([51,53,55,56,57].includes(code)) return '毛毛雨';
  if([61,63,65,66,67].includes(code)) return '下雨';
  if([71,73,75,77].includes(code)) return '下雪';
  if([80,81,82].includes(code)) return '陣雨';
  if([95,96,99].includes(code)) return '雷雨';
  return '';
}

// WMO weather_code -> FontAwesome icon（給 24H 天氣用）
function wmoToFa(code, hour){
  const night = (hour < 6 || hour >= 18);

  // 0: Clear sky
  if(code === 0) return night ? 'fa-moon' : 'fa-sun';

  // 1,2,3: Mainly clear, partly cloudy, overcast
  if(code === 1 || code === 2) return 'fa-cloud';   // 保守：用雲（避免不同版本 FA 沒有 cloud-sun/moon）
  if(code === 3) return 'fa-cloud';

  // 45,48: Fog
  if(code === 45 || code === 48) return 'fa-smog';

  // Drizzle / Rain
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'fa-cloud-rain';

  // Snow
  if([71,73,75,77,85,86].includes(code)) return 'fa-snowflake';

  // Thunderstorm
  if([95,96,99].includes(code)) return 'fa-bolt';

  return 'fa-cloud';
}

async function renderWeatherJMA(meta){
        const el = document.getElementById('weatherStrip');
        if(!el) return;

/*          你想要 01:00~24:00 */
        const pad2 = (n)=>String(n).padStart(2,'0');

/*
         ✅ 16 天限制：如果日期太遠，顯示提示（避免你覺得“不准”）
         這裡用「今天」對比 meta.file 裡的 YYYY-MM-DD（如果你不想依賴 file，可改你自己的 date_range）
*/
        const m = String(meta?.file || '').match(/\d{4}-\d{2}-\d{2}/);
        const iso = m ? m[0] : '';
        if(!iso){
            el.innerHTML = `<div style="padding:10px; color:var(--ink2); font-weight:900;">找不到日期（meta.file 需包含 YYYY-MM-DD）</div>`;
            return;
        }

        const today = new Date();
        const target = new Date(iso + 'T00:00:00');
        const diffDays = Math.floor((target - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);

        if(diffDays < 0 || diffDays > 16){
            el.innerHTML = `<div style="padding:10px; color:var(--ink2); font-weight:900; line-height:1.5;">
            逐時預報只提供未來 16 天。<br/>
            （目前點選是 <b>${iso}</b>）
            </div>`;
            return;
        }

        const ll = getLatLonForMeta(meta);
        if(!ll){
            el.innerHTML = `<div style="padding:10px; color:var(--ink2); font-weight:900; line-height:1.5;">
            尚未設定經緯度：請在 <code>data/itinerary.index.json</code> 這一天加 <code>lat</code> / <code>lon</code>
            </div>`;
            return;
        }

        const url =
            `https://api.open-meteo.com/v1/jma?latitude=${encodeURIComponent(ll.lat)}&longitude=${encodeURIComponent(ll.lon)}`
            + `&hourly=temperature_2m,weather_code`
            + `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset`
            + `&forecast_days=16`
            + `&timezone=Asia%2FTokyo`;

        try{
            const res = await fetch(url, { cache: 'no-store' });
            if(!res.ok){
              throw new Error(`weather fetch failed: ${res.status} ${res.statusText}`);
            }
            const data = await res.json();
            const times = data?.hourly?.time || [];
            const temps = data?.hourly?.temperature_2m || [];
            const codes = data?.hourly?.weather_code || [];
            // ✅ daily（對應當天）
            const dTimes = data?.daily?.time || [];
            const dIdx = dTimes.indexOf(iso);

            const wxSummaryEl = document.getElementById('wxSummary');
            const wxHiLoEl = document.getElementById('wxHiLo');
            const wxSunEl = document.getElementById('wxSun');

            if(dIdx !== -1){
              const dCode = Number(data?.daily?.weather_code?.[dIdx] ?? 0);
              const tMax = data?.daily?.temperature_2m_max?.[dIdx];
              const tMin = data?.daily?.temperature_2m_min?.[dIdx];
              const sunrise = data?.daily?.sunrise?.[dIdx]; // "2026-02-27T06:xx"
              const sunset  = data?.daily?.sunset?.[dIdx];

              const codeText = wmoToZh(dCode); // 下面會給你 mapping

              const minTxt = (tMin != null) ? `${Math.round(tMin)}°` : '';
              const maxTxt = (tMax != null) ? `${Math.round(tMax)}°` : '';

              if(wxSummaryEl){
                const tempPart = (minTxt && maxTxt) ? `  溫度:${minTxt} ~ ${maxTxt}` : '';
                wxSummaryEl.innerHTML = `今天${codeText}${tempPart}`;
              }
              if(wxHiLoEl) wxHiLoEl.textContent = ''; // ✅ 不用第二行就清空（或你乾脆刪掉 wxHiLo 那個DOM）

              const fmt = (s)=> (s && s.includes('T')) ? s.split('T')[1].slice(0,5) : '';
              if(wxSunEl) wxSunEl.textContent = (sunrise && sunset) ? `日出 ${fmt(sunrise)}｜日落 ${fmt(sunset)}` : '';
            }

            const rows = [];
            for(let hh = 6; hh <= 22; hh++){
              const y  = target.getFullYear();
              const mo = pad2(target.getMonth() + 1);
              const d  = pad2(target.getDate());
              const tKey = `${y}-${mo}-${d}T${pad2(hh)}:00`;

              const idx = times.indexOf(tKey);
              if(idx === -1){
                rows.push({ time: pad2(hh)+':00', icon:'fa-minus', temp:'—' });
                continue;
              }
              const icon = wmoToFa(Number(codes[idx] ?? 0), hh);
              const temp = temps[idx] != null ? Math.round(temps[idx]) + '°' : '—';
              rows.push({ time: pad2(hh)+':00', icon, temp });
            }

            el.innerHTML = rows.map(r=>`
            <div class="weather-hour">
                <div class="w-time">${r.time}</div>
                <div class="w-icon"><i class="fas ${r.icon}"></i></div>
                <div class="w-temp">${r.temp}</div>
            </div>
            `).join('');
        }catch(e){
          console.error('weather error:', e);
          el.innerHTML = `<div style="padding:10px; color:var(--ink2); font-weight:900;">
          讀取天氣失敗（網路/CORS/服務暫時不可用）
          </div>`;
        }
    }

  function initModalSwipe(){
    const sh = document.getElementById('modalSheet');
    const splash = document.getElementById('sheetSplash');
    const scrollArea = document.getElementById('modalScroll');
    if(!sh) return;

    let sx=0, sy=0, tracking=false;

    sh.addEventListener('pointerdown', (e)=>{
      if(!sh.classList.contains('active')) return;
      if(splash?.classList.contains('active')) return;

      // ✅ 只有「從 header / sticky 區開始」才判定左右滑（不用一定回到最上）
      const fromHeader = !!e.target.closest('.modal-header, #modalSticky, .sheet-head, .modal-title, .sheet-time');
      if(!fromHeader) return;

      tracking = true;
      sx = e.clientX; sy = e.clientY;
    }, {passive:true});

    sh.addEventListener('pointerup', (e)=>{
      if(!tracking) return;
      tracking = false;

      const dx = e.clientX - sx;
      const dy = e.clientY - sy;

      if(Math.abs(dx) < 60) return;
      if(Math.abs(dx) < Math.abs(dy) * 1.2) return;

      // ✅ 加一個小動畫讓切換「看起來更順」
      modalGoto(dx < 0 ? +1 : -1, { animate:true, skipSplash:true });
    }, {passive:true});

    sh.addEventListener('pointercancel', ()=>{ tracking=false; }, {passive:true});
  }

  function closeModal(){
    if(__closingModal) return;
    __closingModal = true;

    const overlay = document.getElementById('modalOverlay');
    const sheet   = document.getElementById('modalSheet');

    /* 💡 BIOS 邏輯：設定明確的轉移時間，並直接將數值寫入暫存器 */
    const duration = "0.28s";
    const easing = "cubic-bezier(0.16, 1, 0.3, 1)";
    
    sheet.style.transition = `transform ${duration} ${easing}`;
    overlay.style.transition = `opacity ${duration} ease`;
    
    /* 核心：將終點狀態明確寫死，不讓 CSS Class 介入 */
    sheet.style.transform = 'translateX(-50%) translateY(120%)';
    overlay.style.opacity = '0';

    hideSheetSplash();
    
    /* 延後移除 Active 類別，僅作為狀態紀錄 */
    setTimeout(() => {
        sheet.classList.remove('active');
        overlay.classList.remove('active');
        closeMenuCard();
    }, 10);

    const done = ()=>{
      /* 動畫結束後清空所有暫存，恢復到純淨的 CSS 狀態 */
      sheet.style.cssText = '';
      overlay.style.cssText = '';
      unlockBodyScroll();
      __closingModal = false;
    };

    /* 使用 once: true 確保事件只觸發一次 */
    sheet.addEventListener('transitionend', done, { once: true });
    setTimeout(done, 200); 
  }

/*    ===== Modal drag to close ===== */
/* ✅ 修正後的 initModalDrag：增加對內容捲動狀態的感知 */
/* ✅ 優化後的 initModalDrag：徹底解決內容區下拉晃動問題 */
/* ✅ 優化後的 initModalDrag：徹底解決內容區下拉關閉失效與抖動 */
/* ✅ 優化後的 initModalDrag：解決手機端下拉失效 */
/* ✅ 最終修正版：全域鎖定解決手機下拉抖動 */
  (function initModalDrag(){
    const sheet   = document.getElementById('modalSheet');
    const overlay = document.getElementById('modalOverlay');
    const handle  = document.querySelector('.modal-header');
    const scrollArea = document.getElementById('modalScroll');
  
    if(!sheet || !overlay || !handle || !scrollArea) return;
  
    let startY = 0, dy = 0, dragging = false;
  
    const onStart = (e) => {
      if(!sheet.classList.contains('active')) return;

      /* 💡 只有在接近頂端時才啟動下拉關閉中斷 */
      if (scrollArea.scrollTop > 5 && e.target !== handle) return;								 
      dragging = true;
      startY = e.clientY;
      dy = 0;
      
      /* 關鍵：立即鎖定指針並禁止原生捲動 */
      sheet.setPointerCapture(e.pointerId);
      sheet.style.touchAction = 'none';
      scrollArea.style.touchAction = 'none';
    };
  
    const onMove = (e) => {
      if (!dragging) return;
  
      const deltaY = e.clientY - startY;
      
      /* 判定是否真的要下拉 */
      if (deltaY < 0) {
          /* 使用者往上推，釋放控制權交還給捲動引擎 */
          dragging = false;
          sheet.style.touchAction = '';
          scrollArea.style.touchAction = 'pan-y';
          sheet.releasePointerCapture(e.pointerId);
          return;
      }

      /* ✅ 強制攔截所有原生行為，防止抖動 */
      if (e.cancelable) e.preventDefault(); 
      scrollArea.scrollTop = 0; 
      
      dy = deltaY;
      
      requestAnimationFrame(() => {
          sheet.style.transition = 'none';
          overlay.style.transition = 'none';
          sheet.style.transform = `translateX(-50%) translateY(${dy}px)`;
          
          /* 背景隨位移線性變淡 */
          const k = Math.max(0, 1 - dy / 450);
          overlay.style.opacity = (0.38 * k).toFixed(3);
      });
    };
  
    const onEnd = (e) => {
      if (!dragging) return;
      dragging = false;
      sheet.releasePointerCapture(e.pointerId);
      
      /* 恢復標準觸控暫存器 */
      sheet.style.touchAction = '';
      scrollArea.style.touchAction = 'pan-y';
  
      if (dy > 120) {
				
        closeModal();
      } else {
        /* 回彈程序 */
        sheet.style.transition = 'transform .25s cubic-bezier(0.16, 1, 0.3, 1)';
        overlay.style.transition = 'opacity .25s ease';
        sheet.style.transform = 'translateX(-50%) translateY(0)';
        overlay.style.opacity = '0.38'; 
							   
      }
      dy = 0;
    };
  
    handle.addEventListener('pointerdown', onStart);
    scrollArea.addEventListener('pointerdown', onStart);
					   
			  
    sheet.addEventListener('pointermove', onMove, { passive: false });
    sheet.addEventListener('pointerup', onEnd);
    sheet.addEventListener('pointercancel', onEnd);
  })();

  function initHotelSlideshows(){
    // 清除舊 timer
    window.__hotelTimers = window.__hotelTimers || {};
    Object.values(window.__hotelTimers).forEach(t=>clearInterval(t));
    window.__hotelTimers = {};

    document.querySelectorAll('.hotel-track[data-hotel-track]').forEach(track=>{
      const id = track.getAttribute('data-hotel-track') || '';
      enableWheelHorizontal(track); // ✅ 桌機滾輪可左右滑（你站內已經有這個函式）

      const slides = track.children.length;
      if(slides <= 1) return;

      const realCount = slides - 1; // 最後一張是 clone
      let cur = 0;

      // 使用者手滑到最後 clone → 瞬間跳回第 1 張
      track.addEventListener('scroll', ()=>{
        const w = track.clientWidth || 1;
        const idx = Math.round(track.scrollLeft / w);
        if(idx === realCount){
          track.scrollTo({ left: 0, behavior: 'auto' });
          cur = 0;
        }else{
          cur = Math.max(0, Math.min(idx, realCount-1));
        }
      });

      // ✅ 自動播放（8 秒可改）
      window.__hotelTimers[id] = setInterval(()=>{
        const w = track.clientWidth || 1;
        const next = cur + 1;
        track.scrollTo({ left: next * w, behavior: 'smooth' });
        cur = (next >= realCount) ? 0 : next;
      }, 8000);
    });
  }

      };
    }).filter(e => e.name && e.cost > 0);
    localStorage.setItem('expenses', JSON.stringify(expenses));
  }

  function setExpenseType(type){
    curExpenseType = (type === 'prepaid') ? 'prepaid' : 'trip';
    renderExpenseUI();
  }

  function toggleParticipant(u){
    if(curParticipants.has(u)){
/*        至少留 1 個 */
      if(curParticipants.size <= 1) return;
      curParticipants.delete(u);
    }else{
      curParticipants.add(u);
    }
    renderExpenseUI();
  }
  //薪的記帳
  function renderExpenseUI() {
  /* 0) 初始化 */
  if (curParticipants.size === 0) users.forEach(u => curParticipants.add(u));

  /* 1) payer tabs */
  const payerSwitchEl = document.getElementById('payerSwitch');
  if (payerSwitchEl) {
    payerSwitchEl.innerHTML = users.map(u =>
      `<div class="user-tab ${u === curPayer ? 'active' : ''}" onclick="curPayer='${u}'; renderExpenseUI();">${escapeHtml(u)}</div>`
    ).join('');
  }

  /* 2) addMode segmented */
  const modeEl = document.getElementById('addModeSwitch');
  if (modeEl) {
    modeEl.querySelectorAll('.seg-btn').forEach(btn=>{
      const m = btn.getAttribute('data-mode');
      btn.classList.toggle('active', m === addMode);
    });
  }

  /* 3) type segmented（行中/預付）：payment mode 隱藏 */
  const typeEl = document.getElementById('expTypeSwitch');
  if (typeEl) {
    typeEl.style.display = (addMode === 'payment') ? 'none' : '';
    typeEl.querySelectorAll('.seg-btn').forEach(btn => {
      const t = btn.getAttribute('data-type');
      btn.classList.toggle('active', t === curExpenseType);
    });
  }

  const expenseOnly = document.getElementById('expenseOnlyBlock');
  if(expenseOnly) expenseOnly.style.display = (addMode === 'payment') ? 'none' : '';

  /* 4) participants：payment mode 隱藏 */
  const partEl = document.getElementById('partSwitch');
  if (partEl) {
    partEl.style.display = (addMode === 'payment') ? 'none' : '';
    partEl.innerHTML = users.map(u => {
      const on = curParticipants.has(u);
      return `<span class="chip ${on ? 'on' : 'off'}" onclick="toggleParticipant('${escapeHtml(u)}')">
        <i class="fas ${on ? 'fa-user-check' : 'fa-user'}" style="opacity:${on ? 0.55 : 0.35};"></i>${escapeHtml(u)}
      </span>`;
    }).join('');
  }

  /* 5) payTo（收款人） */
  const payToRow = document.getElementById('payToRow');
  const payToSel = document.getElementById('payTo');
  if (payToRow) payToRow.style.display = (addMode === 'payment') ? 'block' : 'none';
  if (addMode === 'payment' && payToSel) {
    payToSel.innerHTML = users
      .filter(u => u !== curPayer)
      .map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`)
      .join('');
  }

  /* ====== 計算：結算 bal（分幣別） ====== */
  const balJPY = {}; const balTWD = {};
  users.forEach(u => { balJPY[u]=0; balTWD[u]=0; });

  // A) expenses → 先算「誰付了多少 / 誰該付多少」
  expenses.forEach(e => {
    const parts = (Array.isArray(e.participants) && e.participants.length) ? e.participants : users;
    const share = Number(e.cost||0) / parts.length;
    const isTWD = (e.currency === 'TWD');
    const bal = isTWD ? balTWD : balJPY;

    if (users.includes(e.payer)) bal[e.payer] += Number(e.cost||0);
    parts.forEach(u => { if(users.includes(u)) bal[u] -= share; });
  });

  // B) payments → 抵扣（from 付給 to：from 少欠（+），to 少收（-））
  payments.forEach(p => {
    const a = Number(p.amount||0);
    if(!a) return;
    const bal = (p.currency === 'TWD') ? balTWD : balJPY;
    if(bal[p.from] == null || bal[p.to] == null) return;
    bal[p.from] += a;
    bal[p.to]   -= a;
  });

  /* ====== 小記（全體） ====== */
  let sumTripJPY=0, sumPrepaidJPY=0, sumTripTWD=0, sumPrepaidTWD=0;
  expenses.forEach(e=>{
    const isTWD = (e.currency === 'TWD');
    const isPre = (e.type === 'prepaid');
    const v = Number(e.cost||0);
    if(isTWD){
      if(isPre) sumPrepaidTWD += v; else sumTripTWD += v;
    }else{
      if(isPre) sumPrepaidJPY += v; else sumTripJPY += v;
    }
  });

  /* ====== 個人小記（curPayer）：用「分攤後」 ====== */
  const my = { tripJPY:0, prepaidJPY:0, tripTWD:0, prepaidTWD:0 };
  expenses.forEach(e=>{
    const parts = (Array.isArray(e.participants) && e.participants.length) ? e.participants : users;
    const share = Number(e.cost||0) / parts.length;
    if(!parts.includes(curPayer)) return;

    const isTWD = (e.currency === 'TWD');
    const isPre = (e.type === 'prepaid');

    if(isTWD){
      if(isPre) my.prepaidTWD += share;
      else      my.tripTWD    += share;
    }else{
      if(isPre) my.prepaidJPY += share;
      else      my.tripJPY    += share;
    }
  });

  /* ====== 渲染：支出明細 ====== */
  const listEl = document.getElementById('expenseList');
  if (listEl) {
    listEl.innerHTML = expenses
      .slice()
      .sort((a,b)=> (b.ts||0)-(a.ts||0))
      .map((e)=>{
        const parts = (Array.isArray(e.participants) && e.participants.length) ? e.participants : users;
        const typeLabel = e.type === 'prepaid' ? '預付' : '行中';
        const typeCls = e.type === 'prepaid' ? 'prepaid' : 'trip';
        const symbol = e.currency === 'TWD' ? '$' : '¥';
        const altSymbol = e.currency === 'TWD' ? '¥' : '$';
        const altCost = e.currency === 'TWD' ? Math.round(e.cost / JPY_TWD_RATE) : Math.round(e.cost * JPY_TWD_RATE);

        return `
          <div style="display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid rgba(233,225,214,.8);">
            <div style="min-width:0;">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <div style="font-weight:900;">${escapeHtml(e.name)}</div>
                <span class="exp-badge ${typeCls}">${typeLabel}</span>
              </div>
              <div style="font-size:0.8rem; color:var(--ink2); font-weight:800; margin-top:4px;">
                ${escapeHtml(e.payer)} 付款 · 分攤：${escapeHtml(parts.join('、'))}
              </div>
            </div>
            <div style="text-align:right; flex:0 0 auto;">
              <div style="font-weight:900;">${symbol}${Math.round(e.cost||0)}</div>
              <div style="font-size:0.75rem; color:#999; font-weight:700;">(${altSymbol}${altCost})</div>
              <div style="font-size:0.8rem; margin-top:4px;">
                <span style="color:var(--accent); cursor:pointer; font-weight:900; margin-right:8px;" onclick="startEdit(${e.ts})">編輯</span>
                <span style="color:#B42318; cursor:pointer; font-weight:900;" onclick="delExpByTs(${e.ts})">刪除</span>
              </div>
            </div>
          </div>`;
      }).join('');
  }

  /* ====== 渲染：收付款明細 ====== */
  const payListEl = document.getElementById('paymentList');
  if(payListEl){
    if(!payments.length){
      payListEl.innerHTML = `<div style="color:var(--ink2); font-weight:800;">尚無收付款紀錄</div>`;
    }else{
      payListEl.innerHTML = payments
        .slice()
        .sort((a,b)=> (b.ts||0)-(a.ts||0))
        .map(p=>{
          const symbol = p.currency === 'TWD' ? '$' : '¥';
          return `
            <div style="display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(233,225,214,.7);">
              <div style="min-width:0;">
                <div style="font-weight:900;">${escapeHtml(p.from)} → ${escapeHtml(p.to)}</div>
                <div style="font-size:.82rem; color:var(--ink2); font-weight:800; margin-top:2px;">收付款</div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:900;">${symbol}${Math.round(p.amount||0)}</div>
                <div style="font-size:.8rem; margin-top:4px;">
                  <span style="color:#B42318; cursor:pointer; font-weight:900;" onclick="delPaymentByTs(${p.ts})">刪除</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
    }
  }

  /* ====== 渲染：結算（Debt List） ====== */
  const debtEl = document.getElementById('debtList');
  if (debtEl) {
    debtEl.innerHTML = users.map(u => {
      const j = Math.round(balJPY[u]);
      const t = Math.round(balTWD[u]);

      const jHtml = (j !== 0)
        ? `<span style="color:${j>0?'#2F8F5B':'#B42318'}">日幣：${j>0?'收':'付'} ¥${Math.abs(j)}</span>`
        : `<span style="color:#999">日幣：已清</span>`;

      const tHtml = (t !== 0)
        ? `<span style="color:${t>0?'#2F8F5B':'#B42318'}">台幣：${t>0?'收':'付'} $${Math.abs(t)}</span>`
        : `<span style="color:#999">台幣：已清</span>`;

      return `
        <div style="padding:10px 0; border-bottom:1px solid #EEE; cursor:pointer;" onclick="showUserDetail('${escapeHtml(u)}')">
          <div style="font-weight:900; color:var(--primary);">👤 ${escapeHtml(u)} (點擊明細)</div>
          <div style="display:flex; justify-content:space-between; font-size:0.9rem; gap:10px;">
            ${jHtml}
            ${tHtml}
          </div>
        </div>`;
    }).join('');
  }

  /* ====== 渲染：全體小記 ====== */
  const sumEl = document.getElementById('expenseSummary');
  if (sumEl) {
    const grandTotalTWD = (sumTripTWD + sumPrepaidTWD) + (sumTripJPY + sumPrepaidJPY) * JPY_TWD_RATE;
    sumEl.innerHTML = `
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(233,225,214,.5); font-weight:900;">
        <span>行中支出</span>
        <div style="text-align:right;">
          <div>¥${Math.round(sumTripJPY)}</div>
          <div style="font-size:0.8rem; color:#888;">$${Math.round(sumTripTWD)}</div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(233,225,214,.5); font-weight:900;">
        <span>預付費用</span>
        <div style="text-align:right;">
          <div>¥${Math.round(sumPrepaidJPY)}</div>
          <div style="font-size:0.8rem; color:#888;">$${Math.round(sumPrepaidTWD)}</div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; padding:8px 0; font-weight:900; color:var(--accent);">
        <span>預估總支出 (換算台幣)</span>
        <div style="text-align:right; font-size:1.2rem;">$${Math.round(grandTotalTWD)}</div>
      </div>
    `;
  }

  /* ====== 渲染：個人小記（分攤後） ====== */
  renderMySummary(my);
  renderPaymentList();
}

  function renderPaymentList(){
    const el = document.getElementById('paymentList');
    if(!el) return;

    if(!payments.length){
      el.innerHTML = `<div style="color:var(--ink2); font-weight:800;">尚無收付款紀錄</div>`;
      return;
    }

    el.innerHTML = payments.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(p=>{
      const symbol = p.currency === 'TWD' ? '$' : '¥';
      return `
        <div style="display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid rgba(233,225,214,.7);">

  function enableWheelHorizontal(el){
    if(!el) return;
    el.addEventListener('wheel', (e)=>{
      /* 偵測垂直滾輪意圖 */
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        e.preventDefault();
        el.scrollLeft += e.deltaY;
        const canScrollLeft = el.scrollLeft > 0;
        const canScrollRight = el.scrollLeft < (el.scrollWidth - el.clientWidth - 1);

        /* 💡 BIOS 邏輯：只有在內部還有空間可以水平位移時，才攔截(PreventDefault)捲動中斷 */
        if ((e.deltaY < 0 && canScrollLeft) || (e.deltaY > 0 && canScrollRight)) {
          e.preventDefault();
          el.scrollLeft += e.deltaY;
        }
        /* 否則：不執行 preventDefault，讓捲動事件冒泡給 body 處理 */
      }
    }, { passive:false });
  }

/*  utils */
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }
  function unescapeHtml(str){
    return String(str ?? '')
      .replaceAll('&amp;','&')
      .replaceAll('&lt;','<')
      .replaceAll('&gt;','>')
      .replaceAll('&quot;','"')
      .replaceAll('&#39;',"'");
  }

  function speakJapanese(text){
    const t = String(text||'').trim();
    if(!t) return;

    if(!('speechSynthesis' in window)) return;

    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP';
    u.rate = 0.95;
    u.pitch = 1.0;

/*      嘗試挑 ja-JP voice */
    const voices = speechSynthesis.getVoices?.() || [];
    const ja = voices.find(v => (v.lang||'').toLowerCase().startsWith('ja'));
    if(ja) u.voice = ja;

    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function bindLongPressSelection() {
/*      選取所有非路徑的行程項目 */
/*      const items = document.querySelectorAll('.timeline-item:not(.route-item)'); */
/*      ✅ 修正 1：移除 :not(.route-item)，讓路徑卡片也能長壓進入編輯模式 */
    const items = document.querySelectorAll('.timeline-item');
    
    items.forEach(el => {
      let pressTimer;
      let isLongPress = false;
      let startPos = { x: 0, y: 0 };
  
      /*        攔截系統選單中斷 */
      el.oncontextmenu = (e) => {
        if (!__tlEditMode) e.preventDefault(); 
      };
  
    /*
    //       const start = (e) => {
    //         if (__tlEditMode) return; 
    //         
    //         isLongPress = false;
    //         startPos = { x: e.clientX, y: e.clientY };
    //         
    //         // 啟動 700ms 定時器
    //         pressTimer = setTimeout(() => {
    //           isLongPress = true;
    //           triggerEditMode(el);
    //         }, 700); 
    //       };
    */
    /*      ✅ 修改：將原始事件 e 傳入 triggerEditMode */
    const start = (e) => {
      if (__tlEditMode) return; 
      
      isLongPress = false;
      startPos = { x: e.clientX, y: e.clientY };
      
      /*        啟動 700ms 定時器 */
      pressTimer = setTimeout(() => {
        isLongPress = true;
        triggerEditMode(el, e);  /* 👈 這裡多傳入 e */
      }, 700); 
    };
  
      const cancel = (e) => {
        clearTimeout(pressTimer);
        
/*          如果不是長壓，且是正常放開指針，則視為「點擊」打開 Modal */
        if (!isLongPress && e.type === 'pointerup') {
/*            檢查位移，避免滑動時意外開啟 Modal */
          const dist = Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y);
          if (dist < 10) {
            const idx = el.dataset.idx;
/*              openModal(idx); */
            if (idx !== undefined) openModal(idx);
          }
        }
      };
  
/*        如果移動距離過大（在滑動網頁），則取消長壓偵測 */
      const move = (e) => {
        const dist = Math.hypot(e.clientX - startPos.x, e.clientY - startPos.y);
/*          if (dist > 10) clearTimeout(pressTimer); */
/*
         ✅ 關鍵：提高「取消長壓」的門檻到 30px
         只要手指移動超過 30 像素，就判定使用者是在「滑動網頁」，立刻殺掉定時器
*/
        if (dist > 20) {
          clearTimeout(pressTimer);
        }
      };
  
/*        綁定所有指針事件 */
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointerup', cancel);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointercancel', () => clearTimeout(pressTimer));
    });
  }

  function pushHistory() {

      if (listEl) {

/*        ✅ 修正 3：先初始化 SortableJS */

  function initModalDragToClose(){
    const sheet = document.getElementById('modalSheet');
    const overlay = document.getElementById('modalOverlay');
    const handle = document.querySelector('.modal-drag-handle');
    const scroller = document.getElementById('modalContent');
    if(!sheet || !handle) return;

    let startY = 0, curY = 0, dragging = false;

    const onDown = (e) => {
      // 只有按在 handle 才開始
      dragging = true;
      startY = (e.touches ? e.touches[0].clientY : e.clientY);
      curY = 0;
      sheet.style.transition = 'none';
    };

    const onMove = (e) => {
      if(!dragging) return;
      const y = (e.touches ? e.touches[0].clientY : e.clientY);
      curY = Math.max(0, y - startY);

      // 如果內容正在滾動且不是在頂端，就不要拖關閉
      if(scroller && scroller.scrollTop > 0) return;

      sheet.style.transform = `translateY(${curY}px)`;
      e.preventDefault();
    };

    const onUp = () => {
      if(!dragging) return;
      dragging = false;
      sheet.style.transition = '';

      // ✅ 拉超過 120px 就關
      if(curY > 120){
        closeModal();
      }else{
        sheet.style.transform = '';
      }
    };

    handle.addEventListener('touchstart', onDown, { passive:true });
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('touchend', onUp);

    handle.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove, { passive:false });
    window.addEventListener('mouseup', onUp);

    // 點 overlay 也可關（你本來就有）
    if(overlay) overlay.addEventListener('click', closeModal);
  }
